[profile.default]
src = "src"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc = "0.8.28"
auto_detect_solc = false
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
  "@openzeppelin/contracts/=lib/hyperlane/solidity/node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/hyperlane/solidity/node_modules/@openzeppelin/contracts-upgradeable/",
]
