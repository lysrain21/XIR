[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xir-testnet-lab"
version = "0.1.0"
description = "Reproducible matched XIR public-testnet experiment prototype"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
  { name = "XIR Research Authors" },
]
dependencies = [
  "cryptography>=46.0.0,<47",
  "eth-abi>=5.2.0,<6",
  "eth-utils>=5.3.1,<6",
  "jsonschema>=4.25.1,<5",
  "matplotlib>=3.10.8,<4",
  "pyyaml>=6.0.3,<7",
  "rfc8785>=0.1.4,<0.2",
  "rlp>=4.1.0,<5",
  "web3>=7.14.0,<8",
]

[project.scripts]
xir-lab = "xir_lab.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19.1,<2",
  "pytest>=9.0.2,<10",
  "ruff>=0.12.2,<0.13",
  "types-jsonschema>=4.25.1,<5",
  "types-pyyaml>=6.0.12.20250915,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xir_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["xir_lab"]
