name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  zero-write:
    runs-on: ubuntu-latest
    env:
      XIR_LIVE_WRITES_DISABLED: "1"
      XIR_LIVE_FEATURE: "approved-pilot-v1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src/xir_lab
      - run: uv run pytest -q
      - run: forge test --root contracts
      - run: uv run python -m xir_lab plan
      - name: Reject tracked secrets and private spool
        run: |
          ! git ls-files | grep -E '(^|/)(private-spool|keystore)(/|$)'
          uv run python scripts/check_publishable_tree.py
          uv run pytest tests/unit/test_publication.py -q
  go-runtime:
    runs-on: ubuntu-latest
    env:
      XIR_LIVE_WRITES_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go-runtime/go.sum
      - uses: foundry-rs/foundry-toolchain@v1
      # The parity vectors are committed and regenerated when the Python runtime
      # changes (scripts/generate_go_parity_vectors.py), so this job needs Go and
      # forge only; the integration tests skip when the protocol artifacts are
      # absent instead of failing.
      - run: forge build --root contracts
      - run: go vet ./...
        working-directory: go-runtime
      - run: go test ./...
        working-directory: go-runtime
